[project]
name = "comfyui-alchemine-pack"
description = """Prompt filtering, lazy execution, LoRA tag loading, image adjustment, etc.
[a/Prompt](https://github.com/alchemine/comfyui-alchemine-pack/blob/main/workflows/comfyui-alchemine-pack-workflow-Prompt.png): filtering, token analyzing, auto BREAK, prompt processors
[a/FlowControl](https://github.com/alchemine/comfyui-alchemine-pack/blob/main/workflows/comfyui-alchemine-pack-workflow-FlowControl.png): lazy execution
Cached LoRA Tag loader, Adjust Image, Everywhere broadcaster, etc."""

version = "7.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/alchemine/comfyui-alchemine-pack"
# Documentation = "https://github.com/alchemine/comfyui-alchemine-pack/wiki"
"Bug Tracker" = "https://github.com/alchemine/comfyui-alchemine-pack/issues"

[tool.comfy]
PublisherId = "alchemine"
DisplayName = "ComfyUI-Alchemine-Pack"
Icon = ""

[tool.ruff]
lint.select = [
  "N805", # invalid-first-argument-name-for-method
  "S307", # suspicious-eval-usage
  "S102", # exec
  "E",
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]

exclude = ["*.ipynb"]